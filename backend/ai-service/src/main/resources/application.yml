server.port: ${SERVER_PORT:8083}
spring:
  application.name: ai-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ciclo_ai}
    username: ${DATABASE_USER:ciclo}
    password: ${DATABASE_PASSWORD:ciclo}
  rabbitmq.addresses: ${RABBITMQ_URL:amqp://ciclo:ciclo@localhost:5672}
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:ciclo}
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-with-at-least-32-bytes}
  ai-master-key: ${AI_KEYS_MASTER_KEY:}
  providers:
    openai-key: ${OPENAI_API_KEY:}
    anthropic-key: ${ANTHROPIC_API_KEY:}
    gemini-key: ${GEMINI_API_KEY:}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:ciclo}
    access-key: ${S3_ACCESS_KEY:minio}
    secret-key: ${S3_SECRET_KEY:minio123}

