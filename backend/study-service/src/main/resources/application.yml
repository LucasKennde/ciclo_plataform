server.port: ${SERVER_PORT:8082}
spring:
  application.name: study-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ciclo_study}
    username: ${DATABASE_USER:ciclo}
    password: ${DATABASE_PASSWORD:ciclo}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://ciclo:ciclo@localhost:5672}
  servlet.multipart:
    max-file-size: 30MB
    max-request-size: 31MB
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-with-at-least-32-bytes}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:ciclo}
    access-key: ${S3_ACCESS_KEY:minio}
    secret-key: ${S3_SECRET_KEY:minio123}
