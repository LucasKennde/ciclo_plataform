# TLS ends at the proxy in front of this container, so $scheme is always http here.
# Forward the scheme the client really used, or the gateway sees https Origins as
# cross-origin and rejects every POST with 403.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # nginx defaults to 1m; PDF uploads go up to 30 MB. Stay above the backend's
  # 31 MB multipart limit so the backend is the one that rejects oversized files.
  client_max_body_size 32m;
  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
  location / { try_files $uri $uri/ /index.html; }
}

