<main class="grid min-h-screen place-items-center bg-bg p-6">
  <form
    [formGroup]="form"
    (ngSubmit)="send()"
    class="grid w-full max-w-md gap-5 rounded-3xl border border-line bg-white p-8"
  >
    <h1 class="text-3xl font-extrabold">Nova senha</h1>
    <label class="grid gap-2 text-sm font-bold"
      >Senha<input
        type="password"
        formControlName="password"
        class="rounded-xl border border-line px-4 py-3" /></label
    ><button class="rounded-xl bg-primary px-5 py-3 font-extrabold text-white">Salvar senha</button>
    @if (message()) {
      <p class="text-sm font-bold text-primary">{{ message() }}</p>
    }
    <a routerLink="/login" class="text-sm text-muted">Voltar ao login</a>
  </form>
</main>
